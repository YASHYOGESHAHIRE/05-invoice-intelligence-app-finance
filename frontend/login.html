
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login | Invoice Intelligence</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #eef4ff;

      font-family: 'Inter', sans-serif;

      padding: 20px;
    }

    .card {

      width: 100%;

      max-width: 420px;

      background: white;

      border-radius: 24px;

      padding: 36px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.08);
    }

    .logo {

      width: 52px;

      height: 52px;

      background: #4b41e1;

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      color: white;

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 20px;
    }

    h1 {

      font-size: 30px;

      font-weight: 800;

      color: #111827;
    }

    .subtitle {

      margin-top: 6px;

      color: #6b7280;

      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .field input {

      width: 100%;

      height: 50px;

      border: 1.5px solid #d1d5db;

      border-radius: 12px;

      padding: 0 16px;

      font-size: 15px;

      outline: none;

      transition: 0.2s;
    }

    .field input:focus {

      border-color: #4b41e1;

      box-shadow:
        0 0 0 4px rgba(75,65,225,.12);
    }

    .password-toggle {

      position: absolute;

      top: 50%;

      right: 16px;

      transform: translateY(-50%);

      cursor: pointer;

      font-size: 13px;

      color: #4b41e1;

      font-weight: 600;
    }

    .btn {

      width: 100%;

      height: 52px;

      border: none;

      border-radius: 14px;

      background: #4b41e1;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .google-btn {

      width: 100%;

      height: 52px;

      border-radius: 14px;

      border: 1.5px solid #d1d5db;

      background: white;

      margin-top: 16px;

      cursor: pointer;

      font-weight: 600;

      transition: 0.2s;
    }

    .google-btn:hover {

      border-color: #4b41e1;

      background: #f5f7ff;
    }

    .divider {

      text-align: center;

      margin: 24px 0;

      color: #9ca3af;

      font-size: 13px;
    }

    .error {

      display: none;

      background: #fff1f2;

      color: #be123c;

      border: 1px solid #fecdd3;

      padding: 12px;

      border-radius: 12px;

      margin-bottom: 18px;

      font-size: 14px;
    }

    .success {

      display: none;

      background: #ecfdf5;

      color: #047857;

      border: 1px solid #a7f3d0;

      padding: 12px;

      border-radius: 12px;

      margin-bottom: 18px;

      font-size: 14px;
    }

    .footer {

      text-align: center;

      margin-top: 22px;

      font-size: 14px;

      color: #6b7280;
    }

    .footer a {

      color: #4b41e1;

      text-decoration: none;

      font-weight: 600;
    }

  </style>

</head>

<script src="./js/auth.js"></script>

<script>

  Auth.redirectIfAuthenticated();

</script>


<body>

<div class="card">

  <div class="logo">
    II
  </div>

  <h1>Welcome back</h1>

  <p class="subtitle">
    Login to your Invoice Intelligence account
  </p>

  <div class="error" id="errorBox"></div>

  <div class="success" id="successBox">
    Login successful. Redirecting...
  </div>

  <form id="loginForm">

    <div class="field">

      <label>Email</label>

      <input
        type="email"
        id="email"
        placeholder="you@company.com"
        required
      />

    </div>

    <div class="field">

      <label>Password</label>

      <div class="input-wrap">

        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
        />

        <span
          class="password-toggle"
          id="togglePassword"
        >
          Show
        </span>

      </div>

    </div>

    <button
      type="submit"
      class="btn"
      id="loginBtn"
    >
      Sign In
    </button>

  </form>

  <div class="divider">
    OR
  </div>

  <button
    class="google-btn"
    id="googleBtn"
  >
    Continue with Google
  </button>

  <div class="footer">

    Don't have an account?

    <a href="signup.html">
      Create Account
    </a>

  </div>

</div>

<script src="./js/auth.js"></script>

<script>

  if (Auth.isLoggedIn()) {

    window.location.href =
      'main.html';
  }

  document
    .getElementById('togglePassword')
    .addEventListener('click', () => {

      const input =
        document.getElementById('password');

      if (input.type === 'password') {

        input.type = 'text';

        togglePassword.innerText = 'Hide';

      } else {

        input.type = 'password';

        togglePassword.innerText = 'Show';
      }
    });

  document
    .getElementById('loginForm')
    .addEventListener('submit', async e => {

      e.preventDefault();

      const errorBox =
        document.getElementById('errorBox');

      const successBox =
        document.getElementById('successBox');

      errorBox.style.display = 'none';

      const btn =
        document.getElementById('loginBtn');

      btn.disabled = true;

      btn.innerText = 'Signing In...';

      try {

        const result =
          await Auth.login({

            email:
              document.getElementById('email').value,

            password:
              document.getElementById('password').value
          });

        successBox.style.display = 'block';

        setTimeout(() => {

          window.location.href =
            'main.html';

        }, 1200);

      } catch (err) {

        errorBox.innerText = err.message;

        errorBox.style.display = 'block';

      } finally {

        btn.disabled = false;

        btn.innerText = 'Sign In';
      }
    });

  document
    .getElementById('googleBtn')
    .addEventListener('click', () => {

      Auth.googleLogin();
    });

</script>

</body>
</html>
